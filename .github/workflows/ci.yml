name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      P2I_MOCK_OCR: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: python -m pip install -e "services/paper-engine[dev]"
      - run: python -m pytest services/paper-engine/tests -q
      - run: npm run typecheck
      - run: npm run build
      - name: Build Python sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1
      - name: Rust quality gates
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo check
          cargo clippy -- -D warnings
          cargo test
      - name: Build Tauri bundle
        run: npm run tauri build --workspace @p2i/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: papers2innovations-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
